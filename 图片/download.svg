<svg font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif" font-weight="430" data-d-component="svg" fill="currentColor" style="color:rgb(26, 28, 31)" viewBox="0 0 340 330" width="100%" xmlns="http://www.w3.org/2000/svg"><rect x="28" y="8" width="284" height="51" rx="7" fill="#F1F5F9" stroke="#94A3B8"/><text x="170" y="29" text-anchor="middle" font-size="13" font-weight="600" fill="#1E293B">malloc / new</text><text x="170" y="46" text-anchor="middle" font-size="10" fill="#475569">申请内存</text><path d="M170 59 V 72" stroke="currentColor" stroke-width="1.5" opacity=".65"/><path d="M166 67 L170 72 L174 67" stroke="currentColor" stroke-width="1.5" fill="none" opacity=".65"/><rect x="28" y="72" width="284" height="51" rx="7" fill="#F1F5F9" stroke="#94A3B8"/><text x="170" y="93" text-anchor="middle" font-size="13" font-weight="600" fill="#1E293B">用户态内存分配器</text><text x="170" y="110" text-anchor="middle" font-size="10" fill="#475569">管理堆内存及空闲内存块</text><path d="M170 123 V 136" stroke="currentColor" stroke-width="1.5" opacity=".65"/><path d="M166 131 L170 136 L174 131" stroke="currentColor" stroke-width="1.5" fill="none" opacity=".65"/><rect x="28" y="136" width="284" height="51" rx="7" fill="#DBEAFE" stroke="#3B82F6"/><text x="170" y="157" text-anchor="middle" font-size="13" font-weight="600" fill="#1E293B">操作系统虚拟内存管理</text><text x="170" y="174" text-anchor="middle" font-size="10" fill="#475569">必要时通过 brk / mmap 扩展空间</text><path d="M170 187 V 200" stroke="currentColor" stroke-width="1.5" opacity=".65"/><path d="M166 195 L170 200 L174 195" stroke="currentColor" stroke-width="1.5" fill="none" opacity=".65"/><rect x="28" y="200" width="284" height="51" rx="7" fill="#F1F5F9" stroke="#94A3B8"/><text x="170" y="221" text-anchor="middle" font-size="13" font-weight="600" fill="#1E293B">首次访问时触发缺页异常</text><text x="170" y="238" text-anchor="middle" font-size="10" fill="#475569">页面尚未映射物理页框时</text><path d="M170 251 V 264" stroke="currentColor" stroke-width="1.5"